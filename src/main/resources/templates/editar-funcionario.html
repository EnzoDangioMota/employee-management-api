<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Gestão de Funcionários | Editar</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css">
</head>
<body>
    <div class="app-shell">
        <aside th:replace="~{fragments/layout :: sidebar('employees')}"></aside>
        <main>
            <header th:replace="~{fragments/layout :: topbar('ms-employee-management')}"></header>
            <nav th:replace="~{fragments/layout :: tabs('employees')}"></nav>
            <div class="content edit-page">
                <section class="panel">
                    <header><p>PUT · ATUALIZAÇÃO COMPLETA</p><h2>Editar funcionário</h2><p>Atualize todos os dados do cadastro #<span th:text="${funcionarioDTO.id}">0</span>.</p></header>
                    <form method="post" th:action="@{/painel/funcionarios/{id}(id=${funcionarioDTO.id})}" th:object="${funcionarioDTO}">
                        <input type="hidden" name="_method" value="PUT">
                        <label>ID<input type="number" th:field="*{id}" readonly></label>
                        <label>Nome *<input th:field="*{nome}" required></label>
                        <label>E-mail *<input type="email" th:field="*{email}" required></label>
                        <label>Telefone<input th:field="*{telefone}"></label>
                        <label>Cargo *<input th:field="*{cargo}" required></label>
                        <label>Departamento<input th:field="*{departamento}"></label>
                        <label>Salário<input type="number" min="0" step="0.01" th:field="*{salario}"></label>
                        <label>Cidade<input th:field="*{cidade}"></label>
                        <label>Status<select th:field="*{status}"><option value="">Não informado</option><option th:each="item : ${statusDisponiveis}" th:value="${item}" th:text="${#strings.replace(item, '_', ' ')}"></option></select></label>
                        <div class="form-actions"><a href="/painel/funcionarios">CANCELAR</a><button class="primary" type="submit">SALVAR COM PUT</button></div>
                    </form>
                </section>
                <section class="panel">
                    <header><p>PATCH · ATUALIZAÇÃO PARCIAL</p><h2>Alterar somente o necessário</h2><p>Preencha apenas os campos que deseja modificar.</p></header>
                    <form class="patch-form" method="post" th:action="@{/painel/funcionarios/{id}(id=${funcionarioDTO.id})}">
                        <input type="hidden" name="_method" value="PATCH">
                        <label>Campo que deseja alterar<select id="patchField" name="campo" required><option value="">Selecione um campo</option><option value="nome">Nome</option><option value="email">E-mail</option><option value="telefone">Telefone</option><option value="cargo">Cargo</option><option value="departamento">Departamento</option><option value="salario">Salário</option><option value="cidade">Cidade</option><option value="status">Status</option></select></label>
                        <label data-patch-option="nome" hidden>Novo nome<input name="nome" placeholder="Informe o novo nome" disabled></label>
                        <label data-patch-option="email" hidden>Novo e-mail<input name="email" type="email" placeholder="Informe o novo e-mail" disabled></label>
                        <label data-patch-option="telefone" hidden>Novo telefone<input name="telefone" placeholder="Informe o novo telefone" disabled></label>
                        <label data-patch-option="cargo" hidden>Novo cargo<input name="cargo" placeholder="Informe o novo cargo" disabled></label>
                        <label data-patch-option="departamento" hidden>Novo departamento<input name="departamento" placeholder="Informe o novo departamento" disabled></label>
                        <label data-patch-option="salario" hidden>Novo salário<input name="salario" type="number" min="0" step="0.01" placeholder="Informe o novo salário" disabled></label>
                        <label data-patch-option="cidade" hidden>Nova cidade<input name="cidade" placeholder="Informe a nova cidade" disabled></label>
                        <label data-patch-option="status" hidden>Novo status<select name="status" disabled><option value="">Selecione o novo status</option><option th:each="item : ${statusDisponiveis}" th:value="${item}" th:text="${#strings.replace(item, '_', ' ')}"></option></select></label>
                        <div class="form-actions"><a href="/painel/funcionarios">VOLTAR</a><button class="secondary" type="submit">ATUALIZAR COM PATCH</button></div>
                    </form>
                </section>
            </div>
        </main>
    </div>
    <script th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>
